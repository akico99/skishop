<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUJU SKI RENTAL - 관리자</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Pretendard', sans-serif; }

        /* 상태 뱃지 */
        .badge-접수  { background:#dbeafe; color:#1d4ed8; }
        .badge-확인  { background:#dcfce7; color:#15803d; }
        .badge-완료  { background:#f1f5f9; color:#475569; }
        .badge-취소  { background:#fee2e2; color:#dc2626; }
        .badge-미입금   { background:#fef9c3; color:#a16207; }
        .badge-부분입금 { background:#ffedd5; color:#c2410c; }
        .badge-입금     { background:#dcfce7; color:#15803d; }

        /* 모달 슬라이드업 */
        #detail-box {
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.34,1.2,0.64,1);
        }
        #detail-overlay.open #detail-box { transform: translateY(0); }
        #detail-overlay { transition: opacity 0.2s; }

        /* 스피너 */
        .spin { animation: spin 0.7s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* 카드 호버 */
        .res-card { transition: border-color 0.15s, box-shadow 0.15s, transform 0.1s; }
        .res-card:active { transform: scale(0.99); }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">

<!-- ====================================================
     로그인 화면
===================================================== -->
<div id="login-screen" class="min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-[360px] bg-white rounded-3xl shadow-xl p-8">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-[#004de6] rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-blue-200">
                <i class="fa-solid fa-mountain text-white text-2xl" aria-hidden="true"></i>
            </div>
            <h1 class="font-black text-[#0f172a] text-[20px] tracking-tight">MUJU SKI RENTAL</h1>
            <p class="text-gray-400 text-[13px] mt-1">관리자 페이지</p>
        </div>

        <div class="space-y-3">
            <div>
                <label for="admin-pw" class="block text-[12px] font-bold text-gray-500 mb-1.5">관리자 비밀번호</label>
                <input type="password" id="admin-pw" placeholder="비밀번호 입력"
                       class="w-full border-2 border-gray-100 rounded-xl px-4 py-3 outline-none focus:border-[#004de6] text-[14px] transition"
                       onkeydown="if(event.key==='Enter') checkAdminPw()">
            </div>
            <p id="login-error" class="text-red-500 text-[12px] hidden">
                <i class="fa-solid fa-circle-exclamation mr-1"></i>비밀번호가 틀렸습니다.
            </p>
            <button onclick="checkAdminPw()"
                    class="w-full bg-[#004de6] text-white rounded-xl py-3.5 font-bold text-[15px] hover:bg-blue-700 transition shadow-sm shadow-blue-200">
                로그인
            </button>
        </div>
    </div>
</div>


<!-- ====================================================
     관리자 대시보드
===================================================== -->
<div id="dashboard" class="hidden min-h-screen flex flex-col">

    <!-- 헤더 -->
    <header class="bg-[#0f172a] text-white px-4 py-3 flex justify-between items-center sticky top-0 z-40 shadow-lg">
        <div class="flex items-center gap-2">
            <i class="fa-solid fa-mountain text-[#004de6] text-lg" aria-hidden="true"></i>
            <span class="font-black text-[15px] tracking-tight">MUJU 관리자</span>
        </div>
        <div class="flex items-center gap-4">
            <span id="header-today" class="text-gray-400 text-[12px]"></span>
            <button onclick="adminLogout()"
                    class="text-gray-400 hover:text-white text-[12px] flex items-center gap-1.5 transition">
                <i class="fa-solid fa-arrow-right-from-bracket text-[11px]" aria-hidden="true"></i>
                로그아웃
            </button>
        </div>
    </header>

    <div class="max-w-2xl mx-auto w-full px-4 py-5 flex-1">

        <!-- 요약 통계 -->
        <div class="grid grid-cols-4 gap-2 mb-5">
            <div class="bg-white rounded-2xl p-3.5 text-center shadow-sm border border-gray-100">
                <div id="stat-total" class="font-black text-[#0f172a] text-[22px] leading-none">-</div>
                <div class="text-gray-400 text-[10px] mt-1 font-medium">전체</div>
            </div>
            <div class="bg-blue-50 rounded-2xl p-3.5 text-center shadow-sm border border-blue-100">
                <div id="stat-접수" class="font-black text-[#1d4ed8] text-[22px] leading-none">-</div>
                <div class="text-blue-400 text-[10px] mt-1 font-medium">접수</div>
            </div>
            <div class="bg-amber-50 rounded-2xl p-3.5 text-center shadow-sm border border-amber-100">
                <div id="stat-미입금" class="font-black text-amber-600 text-[22px] leading-none">-</div>
                <div class="text-amber-400 text-[10px] mt-1 font-medium">미입금</div>
            </div>
            <div class="bg-green-50 rounded-2xl p-3.5 text-center shadow-sm border border-green-100">
                <div id="stat-입금" class="font-black text-green-600 text-[22px] leading-none">-</div>
                <div class="text-green-400 text-[10px] mt-1 font-medium">입금</div>
            </div>
        </div>

        <!-- 필터 패널 -->
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 mb-4">
            <h2 class="font-bold text-[#0f172a] text-[13px] mb-3 flex items-center gap-1.5">
                <i class="fa-solid fa-filter text-[#004de6] text-[11px]" aria-hidden="true"></i> 검색 / 필터
            </h2>
            <div class="space-y-2.5">
                <!-- 날짜 범위 -->
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[10px] text-gray-400 font-medium mb-1">방문일 시작</label>
                        <input type="date" id="filter-start"
                               class="w-full border border-gray-200 rounded-xl px-2.5 py-2 text-[12px] outline-none focus:border-[#004de6] transition">
                    </div>
                    <div>
                        <label class="block text-[10px] text-gray-400 font-medium mb-1">방문일 종료</label>
                        <input type="date" id="filter-end"
                               class="w-full border border-gray-200 rounded-xl px-2.5 py-2 text-[12px] outline-none focus:border-[#004de6] transition">
                    </div>
                </div>
                <!-- 상태 필터 -->
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[10px] text-gray-400 font-medium mb-1">예약 상태</label>
                        <select id="filter-status"
                                class="w-full border border-gray-200 rounded-xl px-2.5 py-2 text-[12px] outline-none focus:border-[#004de6] bg-white transition">
                            <option value="">전체</option>
                            <option>접수</option>
                            <option>확인</option>
                            <option>완료</option>
                            <option>취소</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] text-gray-400 font-medium mb-1">입금 상태</label>
                        <select id="filter-deposit"
                                class="w-full border border-gray-200 rounded-xl px-2.5 py-2 text-[12px] outline-none focus:border-[#004de6] bg-white transition">
                            <option value="">전체</option>
                            <option>미입금</option>
                            <option>부분입금</option>
                            <option>입금</option>
                        </select>
                    </div>
                </div>
                <!-- 검색 + 버튼 -->
                <div class="flex gap-2">
                    <input type="text" id="filter-search" placeholder="이름 또는 연락처"
                           class="flex-1 border border-gray-200 rounded-xl px-3 py-2 text-[12px] outline-none focus:border-[#004de6] transition"
                           onkeydown="if(event.key==='Enter') loadReservations()">
                    <button onclick="loadReservations()"
                            class="bg-[#004de6] text-white px-4 py-2 rounded-xl text-[12px] font-bold hover:bg-blue-700 transition">
                        검색
                    </button>
                    <button onclick="resetFilter()"
                            class="bg-gray-100 text-gray-500 px-3 py-2 rounded-xl text-[12px] font-bold hover:bg-gray-200 transition">
                        초기화
                    </button>
                </div>
            </div>
        </div>

        <!-- 예약 목록 -->
        <div class="flex items-center justify-between mb-2 px-1">
            <div id="reservation-count" class="text-[12px] text-gray-400 font-medium"></div>
            <button onclick="printReservations()"
                    class="text-[12px] font-bold text-[#004de6] bg-blue-50 hover:bg-blue-100 px-3 py-1.5 rounded-lg flex items-center gap-1.5 transition">
                <i class="fa-solid fa-print"></i> 목록 인쇄
            </button>
        </div>
        <div id="reservation-list" class="space-y-2.5 pb-10">
            <div class="text-center py-12 text-gray-300">
                <i class="fa-solid fa-magnifying-glass text-2xl mb-3 block" aria-hidden="true"></i>
                <p class="text-[13px]">날짜·조건을 선택한 뒤 <b class="text-gray-400">검색</b> 버튼을 눌러주세요</p>
            </div>
        </div>
    </div>
</div>


<!-- ====================================================
     예약 상세 모달
===================================================== -->
<div id="detail-overlay"
     class="hidden fixed inset-0 bg-black/60 z-50 flex items-end justify-center opacity-0 transition-opacity"
     onclick="closeDetailOutside(event)">
    <div id="detail-box" class="bg-white w-full max-w-lg rounded-t-3xl max-h-[92vh] overflow-y-auto">

        <!-- 모달 헤더 -->
        <div class="sticky top-0 bg-white px-5 pt-5 pb-3 border-b border-gray-100 flex justify-between items-center z-10">
            <div>
                <p class="text-[11px] text-gray-400 font-medium">예약 상세</p>
                <h2 id="detail-title" class="font-black text-[#0f172a] text-[18px] leading-tight"></h2>
            </div>
            <button onclick="closeDetail()"
                    class="w-9 h-9 rounded-full bg-gray-100 flex items-center justify-center hover:bg-gray-200 transition"
                    aria-label="닫기">
                <i class="fa-solid fa-xmark text-gray-600" aria-hidden="true"></i>
            </button>
        </div>

        <div class="px-5 pb-10 pt-4 space-y-4">

            <!-- 기본 정보 -->
            <div class="bg-gray-50 rounded-2xl p-4 space-y-2.5 text-[13px]">
                <p class="text-[11px] font-bold text-gray-400 uppercase tracking-wide mb-1">예약 정보</p>
                <div class="flex justify-between">
                    <span class="text-gray-400">예약번호</span>
                    <span id="d-no" class="font-black text-[#004de6]"></span>
                </div>
                <div class="flex justify-between">
                    <span class="text-gray-400">접수일시</span>
                    <span id="d-created" class="font-bold text-[#0f172a] text-right"></span>
                </div>
                <div class="flex justify-between">
                    <span class="text-gray-400">예약자</span>
                    <span id="d-name" class="font-bold text-[#0f172a]"></span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-gray-400">연락처</span>
                    <a id="d-phone" href="" class="font-bold text-[#004de6] flex items-center gap-1">
                        <i class="fa-solid fa-phone text-[11px]" aria-hidden="true"></i>
                        <span id="d-phone-text"></span>
                    </a>
                </div>
                <div class="flex justify-between">
                    <span class="text-gray-400">방문일시</span>
                    <span id="d-date" class="font-bold text-[#0f172a]"></span>
                </div>
            </div>

            <!-- 렌탈 내역 -->
            <div class="bg-gray-50 rounded-2xl p-4 space-y-2.5 text-[13px]">
                <p class="text-[11px] font-bold text-gray-400 uppercase tracking-wide mb-1">렌탈 내역</p>
                <div class="flex justify-between">
                    <span class="text-gray-400">장비</span>
                    <span id="d-equip" class="font-bold text-[#0f172a] text-right max-w-[200px]"></span>
                </div>
                <div class="flex justify-between">
                    <span class="text-gray-400">의류</span>
                    <span id="d-cloth" class="font-bold text-[#0f172a] text-right max-w-[200px]"></span>
                </div>
                <div class="flex justify-between">
                    <span class="text-gray-400">헬멧</span>
                    <span id="d-helmet" class="font-bold text-[#0f172a]"></span>
                </div>
                <div class="flex justify-between">
                    <span class="text-gray-400">리프트권</span>
                    <span id="d-lift" class="font-bold text-[#0f172a] text-right max-w-[200px]"></span>
                </div>
                <div id="d-memo-row" class="flex justify-between">
                    <span class="text-gray-400">고객 요청</span>
                    <span id="d-memo" class="font-medium text-[#0f172a] text-right max-w-[200px] text-[12px] leading-relaxed"></span>
                </div>
            </div>

            <!-- 상태 변경 -->
            <div class="space-y-3">
                <p class="text-[11px] font-bold text-gray-400 uppercase tracking-wide">상태 변경</p>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] text-gray-400 font-medium mb-1.5">예약 상태</label>
                        <select id="d-status"
                                class="w-full border-2 border-gray-100 rounded-xl px-3 py-2.5 text-[13px] font-bold outline-none focus:border-[#004de6] bg-white transition">
                            <option>접수</option>
                            <option>확인</option>
                            <option>완료</option>
                            <option>취소</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[11px] text-gray-400 font-medium mb-1.5">입금 상태</label>
                        <select id="d-deposit"
                                class="w-full border-2 border-gray-100 rounded-xl px-3 py-2.5 text-[13px] font-bold outline-none focus:border-[#004de6] bg-white transition">
                            <option>미입금</option>
                            <option>부분입금</option>
                            <option>입금</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-[11px] text-gray-400 font-medium mb-1.5">관리자 메모 (내부용)</label>
                    <textarea id="d-admin-memo" rows="2"
                              placeholder="내부 메모를 입력하세요 (고객에게 보이지 않음)"
                              class="w-full border-2 border-gray-100 rounded-xl px-3 py-2.5 text-[13px] outline-none focus:border-[#004de6] resize-none transition"></textarea>
                </div>
            </div>

            <!-- 저장 버튼 -->
            <button id="save-btn" onclick="saveDetail()"
                    class="w-full bg-[#004de6] text-white rounded-xl py-4 font-bold text-[15px] hover:bg-blue-700 transition shadow-sm">
                <span id="save-btn-text">변경사항 저장</span>
            </button>

        </div>
    </div>
</div>


<script>
// ====================================================
// 설정
// ====================================================
const ADMIN_PASSWORD = 'admin1234'; // ← 원하는 비밀번호로 변경하세요
const SUPABASE_URL   = 'https://ffreclgubmxdznubedam.supabase.co';
const SUPABASE_KEY   = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZmcmVjbGd1Ym14ZHpudWJlZGFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3NDI2OTIsImV4cCI6MjA5NDMxODY5Mn0.PLb2oy5u5qd7lqFOlbr4UJDIk2okxy3OJZkE1sW6FLY';

const { createClient } = supabase;
const _supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

let _reservationMap = {}; // id → 예약 객체
let currentId = null;     // 현재 열린 상세 id


// ====================================================
// 로그인
// ====================================================
function checkAdminPw() {
    const pw  = document.getElementById('admin-pw').value;
    const err = document.getElementById('login-error');
    if (pw === ADMIN_PASSWORD) {
        sessionStorage.setItem('muju_admin', '1');
        err.classList.add('hidden');
        showDashboard();
    } else {
        err.classList.remove('hidden');
        document.getElementById('admin-pw').value = '';
        document.getElementById('admin-pw').focus();
    }
}

function adminLogout() {
    sessionStorage.removeItem('muju_admin');
    document.getElementById('dashboard').classList.add('hidden');
    document.getElementById('login-screen').classList.remove('hidden');
    document.getElementById('admin-pw').value = '';
}

function showDashboard() {
    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('dashboard').classList.remove('hidden');

    const today = new Date();
    document.getElementById('header-today').innerText =
        today.toLocaleDateString('ko-KR', { month:'long', day:'numeric', weekday:'short' });

    // 기본 필터: 오늘 (조회는 사용자가 직접 '조회' 버튼을 눌러 실행)
    const todayStr = today.toISOString().split('T')[0];
    document.getElementById('filter-start').value = todayStr;
    document.getElementById('filter-end').value   = todayStr;
}

// 페이지 로드 시 세션 유지
if (sessionStorage.getItem('muju_admin') === '1') showDashboard();


// ====================================================
// 예약 목록 로드
// ====================================================
async function loadReservations() {
    const list = document.getElementById('reservation-list');
    const cnt  = document.getElementById('reservation-count');
    list.innerHTML = `
        <div class="text-center py-12 text-gray-300">
            <i class="fa-solid fa-rotate spin text-2xl mb-3 block"></i>
            <p class="text-[13px]">불러오는 중...</p>
        </div>`;
    cnt.innerText = '';

    try {
        let q = _supabase
            .from('reservations')
            .select('*')
            .order('created_at', { ascending: false });

        const start  = document.getElementById('filter-start').value;
        const end    = document.getElementById('filter-end').value;
        const status = document.getElementById('filter-status').value;
        const dep    = document.getElementById('filter-deposit').value;
        const search = document.getElementById('filter-search').value.trim();

        if (start)  q = q.gte('visit_date', start);
        if (end)    q = q.lte('visit_date', end);
        if (status) q = q.eq('status', status);
        if (dep)    q = q.eq('deposit_status', dep);
        if (search) q = q.or(`name.ilike.%${search}%,phone.ilike.%${search}%`);

        const { data, error } = await q;
        if (error) throw error;

        _reservationMap = Object.fromEntries((data || []).map(r => [r.id, r]));
        updateStats(data || []);
        renderList(data || []);
        cnt.innerText = `총 ${data.length}건`;

    } catch (err) {
        list.innerHTML = `
            <div class="text-center py-12 text-red-300">
                <i class="fa-solid fa-triangle-exclamation text-2xl mb-3 block"></i>
                <p class="text-[13px] font-bold">데이터를 불러올 수 없습니다</p>
                <p class="text-[11px] text-gray-400 mt-1">${err.message}</p>
            </div>`;
    }
}


// ====================================================
// 통계
// ====================================================
function updateStats(data) {
    document.getElementById('stat-total').innerText   = data.length;
    document.getElementById('stat-접수').innerText    = data.filter(r => r.status === '접수').length;
    document.getElementById('stat-미입금').innerText  = data.filter(r => r.deposit_status === '미입금').length;
    document.getElementById('stat-입금').innerText    = data.filter(r => r.deposit_status === '입금').length;
}


// ====================================================
// 목록 렌더링
// ====================================================
function renderList(data) {
    const list = document.getElementById('reservation-list');
    if (!data.length) {
        list.innerHTML = `
            <div class="text-center py-12 text-gray-300">
                <i class="fa-solid fa-calendar-xmark text-3xl mb-3 block"></i>
                <p class="text-[13px]">해당 조건의 예약이 없습니다</p>
            </div>`;
        return;
    }

    list.innerHTML = data.map(r => {
        const items = [
            ((r.equip_normal||0)+(r.equip_premium||0)) > 0 ? `장비 ${(r.equip_normal||0)+(r.equip_premium||0)}명` : '',
            ((r.cloth_normal||0)+(r.cloth_premium||0)) > 0 ? `의류 ${(r.cloth_normal||0)+(r.cloth_premium||0)}명` : '',
            ((r.helmet_count||0)+(r.goggle_count||0)+(r.visor_count||0)) > 0 ? `옵션 ${(r.helmet_count||0)+(r.goggle_count||0)+(r.visor_count||0)}개` : '',
            ((r.lift_3h_adult||0)+(r.lift_3h_child||0)+(r.lift_4h_adult||0)+(r.lift_4h_child||0)+(r.lift_6h_adult||0)+(r.lift_6h_child||0)) > 0
                ? `리프트 ${(r.lift_3h_adult||0)+(r.lift_3h_child||0)+(r.lift_4h_adult||0)+(r.lift_4h_child||0)+(r.lift_6h_adult||0)+(r.lift_6h_child||0)}명` : ''
        ].filter(Boolean).join(' · ');

        const no = '#' + String(r.reservation_no || 0).padStart(4, '0');

        return `
        <div onclick="openDetail('${r.id}')"
             class="res-card bg-white rounded-2xl p-4 shadow-sm border-2 border-transparent hover:border-blue-200 hover:shadow-md cursor-pointer">
            <div class="flex justify-between items-start mb-2.5">
                <div class="flex items-center gap-2 flex-wrap">
                    <span class="text-[#004de6] font-black text-[13px]">${no}</span>
                    <span class="font-bold text-[#0f172a] text-[15px]">${r.name}</span>
                    <span class="text-gray-400 text-[12px]">${r.phone}</span>
                </div>
                <div class="flex gap-1.5 flex-shrink-0">
                    <span class="badge-${r.status} text-[10px] font-bold px-2 py-0.5 rounded-full">${r.status}</span>
                    <span class="badge-${r.deposit_status} text-[10px] font-bold px-2 py-0.5 rounded-full">${r.deposit_status}</span>
                </div>
            </div>
            <div class="flex justify-between items-center text-[12px]">
                <span class="text-gray-500">
                    <i class="fa-regular fa-calendar mr-1 text-gray-300"></i>
                    ${r.visit_date} ${r.visit_time}
                </span>
                <span class="text-gray-400">${items || '항목 없음'}</span>
            </div>
            ${r.admin_memo ? `
            <div class="mt-2 pt-2 border-t border-gray-100 text-[11px] text-blue-500 flex items-center gap-1">
                <i class="fa-solid fa-note-sticky"></i> ${r.admin_memo}
            </div>` : ''}
        </div>`;
    }).join('');
}


// ====================================================
// 상세 모달 열기
// ====================================================
function openDetail(id) {
    const r = _reservationMap[id];
    if (!r) return;
    currentId = id;

    const no = '#' + String(r.reservation_no || 0).padStart(4, '0');

    document.getElementById('detail-title').innerText = `${r.name} ${no}`;
    document.getElementById('d-no').innerText      = no;
    document.getElementById('d-created').innerText = new Date(r.created_at).toLocaleString('ko-KR');
    document.getElementById('d-name').innerText    = r.name;
    document.getElementById('d-phone').href        = `tel:${r.phone}`;
    document.getElementById('d-phone-text').innerText = r.phone;
    document.getElementById('d-date').innerText    = `${r.visit_date} ${r.visit_time}`;

    document.getElementById('d-equip').innerText  =
        [r.equip_normal  > 0 ? `일반 ${r.equip_normal}명`  : '',
         r.equip_premium > 0 ? `고급 ${r.equip_premium}명` : ''].filter(Boolean).join(' / ') || '없음';
    document.getElementById('d-cloth').innerText  =
        [r.cloth_normal  > 0 ? `일반 ${r.cloth_normal}명`  : '',
         r.cloth_premium > 0 ? `고급 ${r.cloth_premium}명` : ''].filter(Boolean).join(' / ') || '없음';
    document.getElementById('d-helmet').innerText =
        [r.helmet_count > 0 ? `헬멧 ${r.helmet_count}개`   : '',
         r.goggle_count  > 0 ? `고글 ${r.goggle_count}개`  : '',
         r.visor_count   > 0 ? `바이저 ${r.visor_count}개` : ''].filter(Boolean).join(' / ') || '없음';
    const liftParts = [
        (r.lift_3h_adult > 0 || r.lift_3h_child > 0) ? `3시간권 대인${r.lift_3h_adult} 소인${r.lift_3h_child}` : '',
        (r.lift_4h_adult > 0 || r.lift_4h_child > 0) ? `4시간권 대인${r.lift_4h_adult} 소인${r.lift_4h_child}` : '',
        (r.lift_6h_adult > 0 || r.lift_6h_child > 0) ? `6시간권 대인${r.lift_6h_adult} 소인${r.lift_6h_child}` : ''
    ].filter(Boolean);
    document.getElementById('d-lift').innerText = liftParts.join('\n') || '없음';
    document.getElementById('d-memo').innerText   = r.memo || '-';

    document.getElementById('d-status').value      = r.status;
    document.getElementById('d-deposit').value     = r.deposit_status;
    document.getElementById('d-admin-memo').value  = r.admin_memo || '';

    // 모달 열기
    const overlay = document.getElementById('detail-overlay');
    overlay.classList.remove('hidden');
    requestAnimationFrame(() => {
        overlay.classList.add('open');
        overlay.style.opacity = '1';
    });
    document.body.style.overflow = 'hidden';
}

function closeDetail() {
    const overlay = document.getElementById('detail-overlay');
    overlay.style.opacity = '0';
    overlay.classList.remove('open');
    setTimeout(() => {
        overlay.classList.add('hidden');
        overlay.style.opacity = '1';
    }, 300);
    document.body.style.overflow = '';
    currentId = null;
}

function closeDetailOutside(e) {
    if (e.target === document.getElementById('detail-overlay')) closeDetail();
}


// ====================================================
// 상태 저장
// ====================================================
async function saveDetail() {
    if (!currentId) return;

    const btn     = document.getElementById('save-btn');
    const btnText = document.getElementById('save-btn-text');
    btn.disabled  = true;
    btnText.innerHTML = '<i class="fa-solid fa-rotate fa-spin mr-2"></i>저장 중...';

    try {
        const { error } = await _supabase
            .from('reservations')
            .update({
                status:         document.getElementById('d-status').value,
                deposit_status: document.getElementById('d-deposit').value,
                admin_memo:     document.getElementById('d-admin-memo').value.trim() || null
            })
            .eq('id', currentId);

        if (error) throw error;

        closeDetail();
        await loadReservations();

    } catch (err) {
        alert('저장 실패: ' + err.message);
    } finally {
        btn.disabled = false;
        btnText.innerText = '변경사항 저장';
    }
}


// ====================================================
// 필터 초기화
// ====================================================
function resetFilter() {
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('filter-start').value   = today;
    document.getElementById('filter-end').value     = today;
    document.getElementById('filter-status').value  = '';
    document.getElementById('filter-deposit').value = '';
    document.getElementById('filter-search').value  = '';
    loadReservations();
}

// ====================================================
// 목록 인쇄 (요약 + 상세, 새 창)
// ====================================================
function printReservations() {
    const rows = Object.values(_reservationMap || {});
    if (!rows.length) {
        alert('인쇄할 예약이 없습니다. 먼저 검색해 주세요.');
        return;
    }

    const start = document.getElementById('filter-start').value || '';
    const end   = document.getElementById('filter-end').value || '';
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

    // 권종별 집계 (대인/소인 인원)
    const liftDefs = [
        ['3시간권', 'lift_3h_adult', 'lift_3h_child'],
        ['4시간권', 'lift_4h_adult', 'lift_4h_child'],
        ['6시간권', 'lift_6h_adult', 'lift_6h_child']
    ];
    const summary = liftDefs.map(([label, aKey, cKey]) => {
        const adult = rows.reduce((s, r) => s + (r[aKey] || 0), 0);
        const child = rows.reduce((s, r) => s + (r[cKey] || 0), 0);
        return { label, adult, child };
    }).filter(x => x.adult > 0 || x.child > 0);

    const equipTotal = rows.reduce((s, r) => s + (r.equip_normal||0) + (r.equip_premium||0), 0);
    const clothTotal = rows.reduce((s, r) => s + (r.cloth_normal||0) + (r.cloth_premium||0), 0);
    const optTotal   = rows.reduce((s, r) => s + (r.helmet_count||0) + (r.goggle_count||0) + (r.visor_count||0), 0);

    // 방문일 → 시간 순 정렬
    const sorted = [...rows].sort((a, b) =>
        (a.visit_date || '').localeCompare(b.visit_date || '') ||
        (a.visit_time || '').localeCompare(b.visit_time || ''));

    const summaryRows = summary.map(s =>
        `<tr><td>${s.label}</td><td class="num">${s.adult}</td><td class="num">${s.child}</td></tr>`).join('');

    const detailRows = sorted.map((r, i) => {
        const liftStr = liftDefs.map(([label, aKey, cKey]) => {
            const a = r[aKey]||0, c = r[cKey]||0;
            if (!a && !c) return '';
            return `${label} 대${a}/소${c}`;
        }).filter(Boolean).join('<br>') || '-';
        const equip = (r.equip_normal||0)+(r.equip_premium||0);
        const cloth = (r.cloth_normal||0)+(r.cloth_premium||0);
        const opt   = (r.helmet_count||0)+(r.goggle_count||0)+(r.visor_count||0);
        const gear = [equip?`장비 ${equip}`:'', cloth?`의류 ${cloth}`:'', opt?`옵션 ${opt}`:''].filter(Boolean).join(', ') || '-';
        return `<tr>
            <td class="num">${i+1}</td>
            <td>${esc(r.visit_date)}</td>
            <td>${esc(r.visit_time)}</td>
            <td>${esc(r.name)}<br><span class="phone">${esc(r.phone)}</span></td>
            <td class="lift">${liftStr}</td>
            <td>${esc(gear)}</td>
            <td>${esc(r.deposit_status)}</td>
            <td>${esc(r.status)}</td>
            <td class="memo">${esc(r.admin_memo)}</td>
        </tr>`;
    }).join('');

    const period = (start && end) ? (start === end ? start : `${start} ~ ${end}`) : '전체';
    const html = `<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
        <title>예약현황 ${period}</title>
        <style>
            * { box-sizing:border-box; }
            body { font-family:'맑은 고딕','Malgun Gothic',sans-serif; padding:24px; color:#111; }
            h2 { margin:0 0 4px; font-size:20px; }
            .period { color:#555; font-size:13px; margin-bottom:18px; }
            .cap { font-size:13px; font-weight:bold; margin:18px 0 6px; }
            table { width:100%; border-collapse:collapse; margin-bottom:8px; font-size:12px; }
            th, td { border:1px solid #999; padding:6px 8px; text-align:center; }
            th { background:#f0f0f0; }
            td.num { text-align:center; } td.lift { text-align:left; white-space:nowrap; }
            td.memo { text-align:left; font-size:11px; } .phone { color:#666; font-size:11px; }
            td:nth-child(4){ text-align:left; }
            @media print { @page { margin:10mm; } button { display:none; } }
            .toolbar { margin-bottom:16px; }
            .toolbar button { font-size:13px; padding:8px 16px; margin-right:8px; cursor:pointer; }
        </style></head><body>
        <div class="toolbar">
            <button onclick="window.print()">🖨 인쇄</button>
            <button onclick="window.close()">닫기</button>
        </div>
        <h2>놀러와 예약현황</h2>
        <div class="period">기간: ${period} &nbsp;|&nbsp; 총 ${rows.length}건</div>

        <div class="cap">- 요약 (리프트권 권종별 인원)</div>
        <table>
            <thead><tr><th>권종</th><th>대인수</th><th>소인수</th></tr></thead>
            <tbody>${summaryRows || '<tr><td colspan="3">리프트권 신청 없음</td></tr>'}</tbody>
        </table>
        <div style="font-size:12px;margin-bottom:8px;">장비 합계 ${equipTotal}명 · 의류 합계 ${clothTotal}명 · 옵션 합계 ${optTotal}개</div>

        <div class="cap">- 상세목록</div>
        <table>
            <thead><tr>
                <th>No</th><th>방문일</th><th>시간</th><th>성명/연락처</th>
                <th>리프트권</th><th>장비/의류</th><th>입금</th><th>상태</th><th>메모</th>
            </tr></thead>
            <tbody>${detailRows}</tbody>
        </table>
        <script>window.onload = function(){ setTimeout(function(){ window.print(); }, 300); };<\/script>
        </body></html>`;

    const w = window.open('', '_blank');
    if (!w) { alert('팝업이 차단되었습니다. 팝업 허용 후 다시 시도해 주세요.'); return; }
    w.document.write(html);
    w.document.close();
}
</script>

</body>
</html>
