<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/branding/favicon-32.png">
  <link rel="apple-touch-icon" href="/assets/branding/apple-touch-icon.png">
  <title>무주놀러와스키샵 제휴펜션 숙박할인쿠폰</title>
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="무주놀러와스키샵&amp;렌탈샵">
  <meta property="og:title" content="무주놀러와스키샵 제휴펜션 숙박할인쿠폰">
  <meta property="og:description" content="놀러와스키 고객전용 · 주중숙박 20% / 주말숙박 10% 제휴펜션 할인쿠폰">
  <meta property="og:image" content="https://www.nolleowaski.com/assets/photos/og-main.jpg">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0 0 60px;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
      background: #ffffff;
      color: #1e293b;
      word-break: keep-all;
    }
    #cp_wrap {
      max-width: 920px;
      width: 92%;
      margin: 0 auto;
    }

    /* ===== 상단 숙박할인쿠폰 티켓 헤더 ===== */
    .cp_header {
      text-align: center;
      padding: 44px 12px 24px;
    }
    .cp_sub_title {
      font-size: clamp(18px, 3.6vw, 28px);
      font-weight: 800;
      color: #2b2b2b;
      letter-spacing: -0.04em;
      margin: 0 0 6px;
    }
    .cp_main_title {
      font-size: clamp(42px, 9vw, 76px);
      font-weight: 900;
      color: #6d5acd;
      letter-spacing: -0.05em;
      line-height: 1.08;
      margin: 0 0 28px;
    }

    .cp_ticket_wrap {
      position: relative;
      max-width: 580px;
      margin: 34px auto 0;
      padding-top: 32px;
    }
    .cp_badge {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 118px;
      height: 118px;
      border-radius: 50%;
      background: #6d5acd;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      font-weight: 800;
      line-height: 1.3;
      letter-spacing: -0.03em;
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.22);
      z-index: 3;
      border: 3px solid #ffffff;
    }
    .cp_ticket {
      position: relative;
      background: #2b2b2b;
      color: #ffffff;
      padding: 48px 28px 34px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      overflow: hidden;
      border-radius: 4px;
    }
    /* 양옆 티켓 펀칭 홈 + 절취선 */
    .cp_ticket::before,
    .cp_ticket::after {
      content: "";
      position: absolute;
      top: 54%;
      transform: translateY(-50%);
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #ffffff;
      z-index: 2;
    }
    .cp_ticket::before { left: -26px; }
    .cp_ticket::after  { right: -26px; }

    .cp_rate_col {
      text-align: center;
      padding: 0 10px;
    }
    .cp_rate_col + .cp_rate_col {
      border-left: 1px dashed rgba(255, 255, 255, 0.22);
    }
    .cp_rate_label {
      font-size: clamp(15px, 3vw, 22px);
      font-weight: 500;
      color: #e2e8f0;
      margin-bottom: 4px;
      letter-spacing: -0.03em;
    }
    .cp_rate_num {
      font-size: clamp(58px, 13vw, 108px);
      font-weight: 900;
      line-height: 0.95;
      letter-spacing: -0.05em;
      color: #ffffff;
      display: inline-flex;
      align-items: center;
    }
    .cp_rate_num small {
      font-size: 0.34em;
      font-weight: 700;
      margin-left: 2px;
    }

    .cp_notice {
      max-width: 580px;
      margin: 14px auto 0;
      font-size: 13px;
      color: #64748b;
      line-height: 1.5;
    }
    .cp_notice strong {
      color: #0f172a;
    }

    .cp_section_bar {
      margin: 28px 0 28px;
      background: #e9ecef;
      padding: 16px 12px;
      text-align: center;
      font-size: clamp(17px, 3.2vw, 23px);
      font-weight: 800;
      color: #2b2b2b;
      letter-spacing: -0.03em;
    }

    /* ===== 무곡펜션 (상단 와이드 단독 블록) ===== */
    .cp_featured {
      margin-bottom: 36px;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 24px;
    }
    .cp_featured_thumb {
      width: 100%;
      aspect-ratio: 1200 / 344;
      overflow: hidden;
      background: #f1f5f9;
      margin-bottom: 12px;
    }
    .cp_featured_thumb img {
      width: 100%;
      height: calc(100% * 440 / 344);
      object-fit: cover;
      object-position: top center;
      display: block;
    }

    /* ===== 2열 펜션 목록 (스케치, 로베, 루마인, 모모) ===== */
    .cp_list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      column-gap: 20px;
      row-gap: 36px;
    }
    .cp_list > li .thumb {
      width: 100%;
      aspect-ratio: 580 / 344;
      overflow: hidden;
      background: #f1f5f9;
      margin-bottom: 10px;
    }
    .cp_list > li .thumb img {
      width: 100%;
      height: calc(100% * 440 / 344);
      object-fit: cover;
      object-position: top center;
      display: block;
    }

    /* 펜션 이름 + 우측 아이콘 버튼 (홈페이지 / 전화) */
    .info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .subject {
      font-size: 21px;
      font-weight: 800;
      color: #1e293b;
      letter-spacing: -0.03em;
    }
    .cp_btn {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .cp_btn a {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 17px;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    .cp_btn a:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }
    .cp_btn a.btn_home {
      background: #1e293b;
      color: #ffffff;
    }
    .cp_btn a.btn_tel {
      background: #6d5acd;
      color: #ffffff;
    }

    .cp_footer {
      margin-top: 48px;
      padding-top: 20px;
      border-top: 1px solid #e2e8f0;
      text-align: center;
      font-size: 12px;
      color: #64748b;
      line-height: 1.6;
    }
    .cp_footer strong {
      color: #0f172a;
    }

    @media screen and (max-width: 680px) {
      .cp_header { padding: 28px 6px 16px; }
      .cp_ticket_wrap { margin-top: 24px; padding-top: 26px; }
      .cp_badge {
        width: 92px;
        height: 92px;
        font-size: 13.5px;
      }
      .cp_ticket {
        padding: 38px 16px 24px;
      }
      .cp_ticket::before,
      .cp_ticket::after {
        width: 36px;
        height: 36px;
      }
      .cp_ticket::before { left: -18px; }
      .cp_ticket::after  { right: -18px; }

      .cp_list {
        column-gap: 10px;
        row-gap: 26px;
      }
      .subject {
        font-size: 14px;
      }
      .cp_btn {
        gap: 5px;
      }
      .cp_btn a {
        width: 30px;
        height: 30px;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>

    <div class="cp_footer">
